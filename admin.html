<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — Instant Shopping</title>
    <style>
        :root {
            --bg-page: #f8f9fa;
            --bg-card: #ffffff;
            --border-light: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --brand-primary: #0f172a;
            --danger: #dc2626;
            --success: #059669;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-primary); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid var(--border-light); }
        .card { background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border-light); margin-bottom: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-light); border-radius: 4px; }
        button { background: var(--brand-primary); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .product-list { display: flex; flex-direction: column; gap: 12px; }
        .product-item { background: white; padding: 12px; border: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .btn-danger { background: var(--danger); padding: 8px 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Administration Boutique</h1>
    </header>

    <div class="card">
        <h2>Configuration GitHub</h2>
        <div class="form-group">
            <label>Token d'accès personnel (PAT)</label>
            <input type="password" id="githubToken" placeholder="github_pat_...">
        </div>
        <div class="form-group">
            <label>Nom d'utilisateur GitHub</label>
            <input type="text" id="githubUser" placeholder="ex: audrey144">
        </div>
        <div class="form-group">
            <label>Nom du dépôt</label>
            <input type="text" id="githubRepo" placeholder="ex: audrey144.github.io">
        </div>
        <button onclick="saveConfig()">Enregistrer la configuration</button>
    </div>

    <div class="card">
        <h2>Ajouter un Produit</h2>
        <form id="productForm">
            <div class="form-group"><label>Nom</label><input type="text" id="title" required></div>
            <div class="form-group"><label>Prix (FCFA)</label><input type="number" id="price" required></div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="category">
                    <option value="Soins & Beauté">Soins & Beauté</option>
                    <option value="Accessoires">Accessoires</option>
                    <option value="Électronique">Électronique</option>
                </select>
            </div>
            <div class="form-group"><label>Lien de l'image</label><input type="url" id="image" required></div>
            <button type="submit">Publier le produit</button>
        </form>
    </div>

    <div class="card">
        <h2>Catalogue Actuel</h2>
        <div id="adminList" class="product-list">Chargement...</div>
    </div>
</div>

<script>
    let config = JSON.parse(localStorage.getItem('gh_config')) || {};
    let products = [];

    async function loadProducts() {
        if(!config.token || !config.user || !config.repo) {
            document.getElementById('adminList').innerHTML = 'Veuillez configurer vos accès GitHub.';
            return;
        }
        try {
            const res = await fetch(https://api.github.com/repos/${config.user}/${config.repo}/contents/products.json, {
                headers: { Authorization: token ${config.token}, 'If-None-Match': '' }
            });
            if(res.ok) {
                const data = await res.json();
                products = JSON.parse(atob(data.content));
                renderList();
            } else {
                products = [];
                document.getElementById('adminList').innerHTML = 'Aucun produit trouvé. Créez-en un.';
            }
        } catch(e) {
            document.getElementById('adminList').innerHTML = 'Erreur de chargement.';
        }
    }

    function renderList() {
        const container = document.getElementById('adminList');
        if(!products.length) {
            container.innerHTML = 'Catalogue vide.';
            return;
        }
        container.innerHTML = products.map((p, index) => `
            <div class="product-item">
                <div><strong>${p.title}</strong> — ${p.price.toLocaleString()} FCFA</div>
                <button class="btn-danger" onclick="deleteProduct(${index})">Supprimer</button>
            </div>
        `).join('');
    }

    function saveConfig() {
        config = {
            token: document.getElementById('githubToken').value.trim(),
            user: document.getElementById('githubUser').value.trim(),
            repo: document.getElementById('githubRepo').value.trim()
        };
        localStorage.setItem('gh_config', JSON.stringify(config));
        alert('Configuration enregistrée !');
        loadProducts();
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!config.token) return alert('Configurez GitHub d\'abord.');
        
        const newProduct = {
            title: document.getElementById('title').value,
            price: Number(document.getElementById('price').value),
            category: document.getElementById('category').value,
            image: document.getElementById('image').value
        };

        products.unshift(newProduct);
        await saveToGitHub();
        e.target.reset();
        loadProducts();
    });

    async function deleteProduct(index) {
        products.splice(index, 1);
        await saveToGitHub();
        loadProducts();
    }

    async function saveToGitHub() {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
        try {
            let sha = '';
            const checkRes = await fetch(https://api.github.com/repos/${config.user}/${config.repo}/contents/products.json, {
                headers: { Authorization: token ${config.token} }
            });
            if(checkRes.ok) {
                const data = await checkRes.json();
                sha = data.sha;
            }

            const res = await fetch(https://api.github.com/repos/${config.user}/${config.repo}/contents/products.json, {
                method: 'PUT',
                headers: { Authorization: token ${config.token}, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'Mise à jour catalogue',
                    content: content,
                    sha: sha
                })
            });
            if(res.ok) alert('Produit enregistré sur GitHub ! Patientez 1 à 2 min pour le voir en ligne.');
            else alert('Erreur lors de la sauvegarde.');
        } catch(e) {
            alert('Erreur réseau.');
        }
    }

    if(config.token) {
        document.getElementById('githubToken').value = config.token;
        document.getElementById('githubUser').value = config.user;
        document.getElementById('githubRepo').value = config.repo;
        loadProducts();
    }
</script>

</body>
</html>
