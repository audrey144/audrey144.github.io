<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instant Shopping</title>
<style>
:root {
--bg-page: #ffffff;
--text-primary: #111827;
--text-secondary: #4b5563;
--brand-primary: #0f172a;
--brand-accent: #c2410c;
--border-light: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background-color: var(--bg-page); color: var(--text-primary); padding-bottom: 70px; }
header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border-light); padding: 10px 20px; z-index: 1000; }
.header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.logo { font-weight: bold; font-size: 1.2rem; }
.search-input { padding: 8px; width: 200px; border: 1px solid var(--border-light); border-radius: 4px; }
.view-section { display: none; }
.view-section.active { display: block; }
.container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
.card { border: 1px solid var(--border-light); padding: 10px; border-radius: 8px; text-align: center; }
.card img { max-width: 100%; height: auto; border-radius: 4px; }
.btn { background: var(--brand-primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border-light); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
.nav-tab { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; }
.nav-tab.active { color: var(--brand-accent); font-weight: bold; }
.panel { border: 1px solid var(--border-light); padding: 20px; border-radius: 8px; margin-top: 10px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; }
.form-group input { width: 100%; padding: 8px; border: 1px solid var(--border-light); border-radius: 4px; }
</style>
</head>
<body>
<header>
<div class="header-content">
<div class="logo">Instant Shopping</div>
<input type="text" class="search-input" placeholder="Rechercher...">
</div>
</header>
<main id="view-accueil" class="view-section active">
<div class="container">
<h1>Accueil</h1>
<p>Bienvenue sur notre boutique.</p>
</div>
</main>
<main id="view-produits" class="view-section">
<div class="container">
<h1>Produits</h1>
<div class="grid" id="product-grid">
<div class="card">
<img src="[https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300](https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300)" alt="Produit">
<h3>Montre</h3>
<p>25 000 FCFA</p>
<button class="btn">Ajouter</button>
</div>
<div class="card">
<img src="[https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300](https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300)" alt="Produit">
<h3>Casque</h3>
<p>15 000 FCFA</p>
<button class="btn">Ajouter</button>
</div>
</div>
</div>
</main>
<main id="view-panier" class="view-section">
<div class="container">
<h1>Panier</h1>
<p>Votre panier est vide.</p>
</div>
</main>
<main id="view-compte" class="view-section">
<div class="container">
<h1>Mon Compte</h1>
<div class="panel">
<h2>Programme Affilié</h2>
<p>Partagez votre lien et gagnez des commissions.</p>
<p style="font-weight: bold; margin: 10px 0;">Lien : https://instantshopping.ci/?ref=user</p>
</div>
<div class="panel">
<h2>Ajouter un produit</h2>
<form onsubmit="event.preventDefault(); alert('Produit ajouté !');">
<div class="form-group">
<label>Nom du produit</label>
<input type="text" required>
</div>
<div class="form-group">
<label>Prix (FCFA)</label>
<input type="number" required>
</div>
<button type="submit" class="btn">Publier</button>
</form>
</div>
</div>
</main>
<nav class="bottom-nav">
<button class="nav-tab active" onclick="switchView('accueil')">
<span>🏠</span>
Accueil
</button>
<button class="nav-tab" onclick="switchView('produits')">
<span>📦</span>
Produits
</button>
<button class="nav-tab" onclick="switchView('panier')">
<span>🛒</span>
Panier
</button>
<button class="nav-tab" onclick="switchView('compte')">
<span>👤</span>
Compte
</button>
</nav>
<script>
function switchView(viewId) {
document.querySelectorAll('.view-section').forEach(section => {
section.classList.remove('active');
});
document.querySelectorAll('.nav-tab').forEach(tab => {
tab.classList.remove('active');
});
document.getElementById('view-' + viewId).classList.add('active');
event.currentTarget.classList.add('active');
}
</script>
</body>
</html>
